<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-container">
      <header class="app-header">
        <h1>Quote of the Day</h1>
        <p class="subtitle">Daily wisdom, reflection, and inspiration</p>
      </header>

      <section
        class="quote-card"
        data-testid="quote-card"
        role="region"
        aria-label="Quote of the Day"
      >
        <div class="quote-content">
          <blockquote class="quote-text" data-testid="quote-text">
            Loading quote...
          </blockquote>
          <cite class="quote-author" data-testid="quote-author"></cite>
        </div>

        <div class="quote-actions">
          <button
            type="button"
            class="btn btn-favorite"
            data-testid="favorite-btn"
            aria-pressed="false"
            aria-label="Add quote to favorites"
          >
            <span class="favorite-icon" data-testid="favorite-icon" aria-hidden="true">★</span>
            <span class="favorite-text">Favorite</span>
          </button>

          <button
            type="button"
            class="btn btn-primary"
            data-testid="new-quote-btn"
            aria-label="Load a new quote"
          >
            New quote
          </button>
        </div>
      </section>

      <div
        id="status-announcer"
        class="sr-only"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
